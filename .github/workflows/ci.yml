name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [pivot/verified-actions]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Trusted source smoke
        run: npm run trust:smoke

      - name: Database smoke
        run: npm run db:smoke

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
